<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1B5E5E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Financ"/>
<title>Financ — Na palma da mão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('splash').style.opacity='0';document.getElementById('auth-screen').style.display='flex'"></script>
<style>
:root{--t:#1B5E5E;--t2:#2D7575;--t3:#3D9494;--tl:#E1F5EE;--red:#993C1D;--grn:#0F6E56;--gr:#E0E0E0;--bg:#F4F6F5;--card:#FFFFFF;--txt:#1A1A1A;--txt2:#666;--bdr:#E0E0E0;--r:12px;--rs:8px;--fs:100%}
[data-dark]{--bg:#0F1A1A;--card:#1A2A2A;--txt:#F0F5F5;--txt2:#8AABAB;--bdr:#2A3F3F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);height:100%}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative}

/* AUTH SCREEN */
#auth-screen{position:fixed;inset:0;background:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:24px}
.auth-logo{color:#fff;font-size:2.5rem;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.auth-tag{color:rgba(255,255,255,.7);font-size:0.875rem;margin-bottom:40px}
.auth-box{background:#fff;border-radius:var(--r);padding:24px;width:100%;max-width:360px}
.auth-title{font-size:1.125rem;font-weight:700;color:var(--t);margin-bottom:20px;text-align:center}
.auth-fld{margin-bottom:14px}
.auth-fld label{font-size:0.6875rem;color:var(--txt2);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.auth-fld input{width:100%;padding:12px;font-size:0.9375rem;border:1px solid var(--bdr);border-radius:var(--rs);outline:none;color:var(--txt)}
.auth-fld input:focus{border-color:var(--t)}
.auth-btn{width:100%;padding:13px;background:var(--t);color:#fff;border:none;border-radius:var(--rs);font-size:0.9375rem;font-weight:700;cursor:pointer;margin-top:4px}
.auth-btn:active{opacity:.85}
.auth-btn.sec{background:transparent;color:var(--t);border:1.5px solid var(--t);margin-top:10px}
.auth-err{background:#FFEBEE;color:#C62828;border-radius:6px;padding:8px 12px;font-size:0.75rem;margin-bottom:12px;display:none}
.auth-ok{background:#E8F5E9;color:#2E7D32;border-radius:6px;padding:8px 12px;font-size:0.75rem;margin-bottom:12px;display:none}
.auth-switch{text-align:center;margin-top:16px;font-size:0.8125rem;color:var(--txt2)}
.auth-switch span{color:var(--t);font-weight:600;cursor:pointer}
.auth-loading{display:none;text-align:center;color:var(--t);font-size:0.875rem;padding:8px}

/* HEADER */
.header{background:var(--t);color:#fff;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.huser{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit{position:absolute;bottom:0;right:0;width:16px;height:16px;background:var(--t2);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;color:#fff}
.hdr-name{font-size:1rem;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:8px}
.ibt{background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:8px;cursor:pointer;color:#fff;display:flex;align-items:center}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;margin-left:4px;flex-shrink:0}
.sync-dot.syncing{background:#FFC107;animation:blink .8s infinite}
.sync-dot.offline{background:#f44336}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* MONTH BAR */
.mbar{background:var(--t2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;flex-shrink:0}
.mbar button{background:none;border:none;color:#fff;cursor:pointer;padding:4px 10px;font-size:1.375rem;line-height:1}
.mbar span{font-size:0.8125rem;font-weight:500;text-transform:capitalize}

/* TABS */
.tabs{background:var(--card);display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;gap:3px;border:none;background:none;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;font-size:0.625rem;transition:color .15s,border-color .15s}
.tb.on{color:var(--t);border-bottom-color:var(--t);font-weight:600}
.tb svg{width:18px;height:18px}

/* CONTENT */
.cnt{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.cnt::-webkit-scrollbar{display:none}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:14px;margin-bottom:12px}
.ctit{font-size:0.625rem;font-weight:600;color:var(--t);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:var(--bg);border-radius:var(--rs);padding:10px}
.sc .sl{font-size:0.625rem;color:var(--txt2);margin-bottom:3px}
.sc .sv{font-size:0.8125rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnut{display:flex;justify-content:center;margin:4px 0 10px}
.dleg{display:flex;justify-content:center;gap:16px;font-size:0.6875rem;color:var(--txt2)}
.ldot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}
.pw{margin-bottom:12px}
.pm{display:flex;justify-content:space-between;font-size:0.6875rem;color:var(--txt2);margin-bottom:4px}
.pm span:last-child{font-weight:500}
.pt{height:7px;background:var(--gr);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .5s ease}
.pp{font-size:0.625rem;color:var(--txt2);margin-top:2px}
.lhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lhdr .st{font-size:0.9375rem;font-weight:600}
.lhdr .ss{font-size:0.75rem;color:var(--txt2);margin-top:2px}

/* ITEMS */
.item{background:var(--card);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;border:1px solid var(--bdr)}
.item.pendente{border-left:3px solid #E9A000}
.item.ok{border-left:3px solid var(--grn)}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ileft{flex:1;min-width:0}
.iname{font-size:0.8125rem;font-weight:500}
.isub{font-size:0.6875rem;color:var(--txt2);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ival{font-size:0.9375rem;font-weight:600}
.dbtn{background:none;border:none;cursor:pointer;color:#cc4444;padding:4px;display:flex}
.edit-btn{background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px;cursor:pointer;color:var(--t);display:flex;align-items:center;transition:background .15s}
.edit-btn:hover{background:var(--tl)}
.bdg{font-size:0.625rem;border-radius:4px;padding:2px 7px;display:inline-block}
.pend-badge{background:#FFF3CD;color:#856404}
.fix-badge{background:var(--tl);color:var(--t)}
.rep-badge{background:#E8F4FD;color:#185FA5}
.venc-ok{background:#E8F5E9;color:#2E7D32;font-weight:600}
.venc-hoje{background:#FFF3E0;color:#E65100;font-weight:700}
.venc-atrasado{background:#FFEBEE;color:#C62828;font-weight:700}
.venc-prox{background:#FFF8E1;color:#F57F17;font-weight:600}
.fill-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.fill-row input{flex:1;min-width:80px;padding:7px 10px;font-size:0.8125rem;border:1.5px solid var(--t);border-radius:var(--rs);background:var(--bg);color:var(--txt);outline:none}
.fill-btn{background:var(--t);color:#fff;border:none;border-radius:var(--rs);padding:7px 12px;font-size:0.75rem;cursor:pointer;font-weight:600;white-space:nowrap}
.cancel-btn{background:none;color:var(--txt2);border:1px solid var(--bdr);border-radius:var(--rs);padding:7px 10px;font-size:0.75rem;cursor:pointer}
.chk{width:22px;height:22px;border:2px solid var(--bdr);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s}
.chk.on{background:var(--t);border-color:var(--t)}
.btn{background:var(--t);color:#fff;border:none;border-radius:var(--rs);padding:9px 16px;font-size:0.8125rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn:active{opacity:.85;transform:scale(.98)}
.btnf{width:100%;justify-content:center;padding:12px;font-size:0.875rem}
.empty{text-align:center;padding:40px 0;color:var(--txt2);font-size:0.8125rem}
.section-note{font-size:0.6875rem;color:var(--txt2);background:var(--bg);border-radius:6px;padding:8px 10px;margin-bottom:10px;border-left:3px solid var(--t);line-height:1.5}
.bkcard{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:14px;margin-bottom:12px}
.bkrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr)}
.bkrow:last-child{border-bottom:none}
.bkrow .bl{font-size:0.8125rem;color:var(--txt);display:flex;align-items:center;gap:6px}
.bkrow .br{font-size:0.8125rem;font-weight:600}
.bkrow.total{background:var(--bg);margin:8px -14px -14px;padding:10px 14px;border-radius:0 0 var(--r) var(--r);border-bottom:none}
.bkrow.total .bl{font-size:0.875rem;font-weight:600;color:var(--txt)}
.bkrow.total .br{font-size:0.9375rem}
.bksep{height:1px;background:var(--bdr);margin:6px 0}
.badge-pago{background:#E8F5E9;color:#2E7D32;font-size:0.625rem;padding:1px 5px;border-radius:3px}
.badge-pend{background:#FFF3E0;color:#E65100;font-size:0.625rem;padding:1px 5px;border-radius:3px}
.badge-res{background:#E3F2FD;color:#1565C0;font-size:0.625rem;padding:1px 5px;border-radius:3px}
.alert-banner{background:#FFF8E1;border:1px solid #FFCC02;border-radius:var(--rs);padding:10px 14px;margin-bottom:12px}
.ab-title{font-size:0.75rem;font-weight:700;color:#E65100;margin-bottom:6px}
.alert-row{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.alert-row:last-child{border-bottom:none}
.alert-row .an{color:var(--txt);font-weight:500}
.alert-row .ad{padding:2px 8px;border-radius:4px;font-size:0.6875rem;font-weight:700}
.cbw{margin-bottom:8px}
.cbl{display:flex;justify-content:space-between;font-size:0.6875rem;color:var(--txt2);margin-bottom:3px}
.cbt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.cbf{height:100%;border-radius:4px;background:var(--t);transition:width .5s ease}
.avatar-cfg{width:80px;height:80px;border-radius:50%;border:3px solid var(--t);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;margin:0 auto 8px;background:var(--bg);position:relative}
.avatar-cfg .overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:0.5625rem;font-weight:600;gap:2px;opacity:0;transition:opacity .2s}
.avatar-cfg:hover .overlay,.avatar-cfg:active .overlay{opacity:1}
.avatar-cfg-lbl{text-align:center;font-size:0.6875rem;color:var(--txt2);margin-bottom:16px}
.sep{height:1px;background:var(--bdr);margin:12px 0}
.hint{font-size:0.6875rem;color:var(--txt2);background:var(--tl);border-radius:6px;padding:8px 10px;margin-bottom:14px;line-height:1.5}
.fld{margin-bottom:14px}
.fld label{font-size:0.6875rem;color:var(--txt2);display:block;margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;padding:11px 12px;font-size:0.875rem;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--bg);color:var(--txt);outline:none;-webkit-appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--t)}
.chkrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.chkrow span{font-size:0.8125rem}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mov.open{opacity:1;pointer-events:all}
.mbox{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px 36px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
.mov.open .mbox{transform:translateY(0)}
.mhdl{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 16px}
.mtit{font-size:1rem;font-weight:700;color:var(--t);margin-bottom:20px}
#splash{position:fixed;inset:0;background:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;animation:splashOut 0.5s ease 2.5s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
#splash h1{color:#fff;font-size:2.25rem;font-weight:800;letter-spacing:-1px}
#splash p{color:rgba(255,255,255,.7);font-size:0.875rem;margin-top:6px}
#splash .ld{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin-top:40px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="splash"><h1>Financ</h1><p>Na palma da mão</p><div class="ld"></div></div>

<!-- TELA DE AUTH -->
<div id="auth-screen" style="display:flex">
  <div class="auth-logo">Financ</div>
  <div class="auth-tag">Na palma da mão</div>
  <div class="auth-box">
    <div class="auth-title" id="auth-title">Entrar na sua conta</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-ok" id="auth-ok"></div>
    <div class="auth-loading" id="auth-loading">Aguarde...</div>
    <div id="auth-form-login">
      <div class="auth-fld"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="auth-fld"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="auth-btn" onclick="doLogin()">Entrar</button>
      <button class="auth-btn sec" onclick="showRegister()">Criar conta grátis</button>
      <div style="text-align:center;margin-top:12px"><span style="font-size:0.8125rem;color:#1B5E5E;cursor:pointer;text-decoration:underline" onclick="showForgot()">Esqueci minha senha</span></div>
    </div>
    <div id="auth-form-register" style="display:none">
      <div class="auth-fld"><label>Seu nome</label><input id="reg-nome" type="text" placeholder="Ex: João Silva"/></div>
      <div class="auth-fld"><label>E-mail</label><input id="reg-email" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="auth-fld"><label>Senha (mín. 6 caracteres)</label><input id="reg-pass" type="password" placeholder="••••••••" autocomplete="new-password"/></div>
      <button class="auth-btn" onclick="doRegister()">Criar conta</button>
      <button class="auth-btn sec" onclick="showLogin()">Já tenho conta</button>
    </div>
    <div id="auth-form-forgot" style="display:none">
      <div class="auth-fld"><label>Seu e-mail cadastrado</label><input id="forgot-email" type="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <button class="auth-btn" onclick="doForgot()">Enviar link de recuperação</button>
      <button class="auth-btn sec" onclick="showLogin()">Voltar para o login</button>
    </div>
    <div id="auth-form-newpass" style="display:none">
      <div class="auth-fld"><label>Nova senha (mín. 6 caracteres)</label><input id="newpass1" type="password" placeholder="••••••••" autocomplete="new-password"/></div>
      <div class="auth-fld"><label>Confirmar nova senha</label><input id="newpass2" type="password" placeholder="••••••••" autocomplete="new-password"/></div>
      <button class="auth-btn" onclick="doNewPass()">Salvar nova senha</button>
    </div>
    <div class="auth-switch" id="auth-switch-lbl">
      Não tem conta? <span onclick="showRegister()">Cadastre-se grátis</span>
    </div>
    <div id="auth-tip" style="margin-top:14px;font-size:0.75rem;color:rgba(255,255,255,.6);text-align:center;line-height:1.5">
      💡 Se acabou de se cadastrar e não consegue entrar, verifique seu e-mail para confirmar o cadastro.
    </div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app" style="display:none">
  <div class="header">
    <div class="huser" onclick="openModal('cfg')">
      <div class="avatar-wrap">
        <div class="avatar" id="hdr-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="26" height="26"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="avatar-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
      </div>
      <div>
        <div class="hdr-name" id="hdr-name">Financ</div>
        <div style="font-size:0.6875rem;opacity:.7" id="hdr-email"></div>
      </div>
    </div>
    <div class="hbtns">
      <button class="ibt" onclick="toggleDark()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
      <button class="ibt" title="Status sincronização" style="position:relative" onclick="syncNow()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        <span class="sync-dot" id="sync-dot"></span>
      </button>
      <button class="ibt" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>
  <input type="file" id="foto-input" accept="image/*" style="display:none" onchange="handleFoto(event)"/>

  <div class="mbar">
    <button onclick="chMon(-1)">&#8249;</button>
    <span id="mlbl"></span>
    <button onclick="chMon(1)">&#8250;</button>
  </div>

  <div class="tabs">
    <button class="tb on" data-tab="dashboard" onclick="swTab('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Início</button>
    <button class="tb" data-tab="entradas" onclick="swTab('entradas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>Entradas</button>

async function saveToCloud(){
  if(!supa||!S.user) return;
  if(S.syncing){ scheduleSave(); return; }
  S.syncing=true;
  setSyncStatus('syncing');
  try{
    const uid=S.user.id;

    // ── Salvar perfil ──
    await supa.from('profiles').upsert({
      id:uid,
      nome:S.cfg.nome||'',
      foto:S.cfg.foto||null,
      re_meta:S.cfg.reMeta||5000,
      meta_nome:S.cfg.metaNome||'Meta pessoal',
      meta_val:S.cfg.metaVal||500,
      fs:S.cfg.fs||100,
      dark:!!S.cfg.dark
    },{ignoreDuplicates:false});

    // ── Salvar todos os meses ──
    const entries=Object.entries(S.data);
    if(entries.length>0){
      const rows=entries.map(([mes,dados])=>({
        user_id:uid, mes, dados,
        updated_at:new Date().toISOString()
      }));

        .upsert(rows,{onConflict:'user_id,mes',ignoreDuplicates:false});
      if(mErr) throw new Error('meses: '+mErr.message);
    }

    // ── Salvar templates ──
    await supa.from('templates').upsert({
      user_id:uid,
      dados:T_,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id',ignoreDuplicates:false});

  }catch(e){
    console.error('❌ Erro ao salvar:',e.message);
    setSyncStatus('offline');
  }finally{
    S.syncing=false;
  }
}

// ─── TOTALS ──────────────────────────────────────────────────────
function totals(){
  const md=getMD();
  const tE=(md.entradas||[]).filter(e=>e.v!=null).reduce((s,e)=>s+(+e.v||0),0);
  const tG=(md.gastos||[]).reduce((s,g)=>s+(+g.v||0),0);
  const tC=(md.contas||[]).filter(c=>c.ok&&c.pago!=null).reduce((s,c)=>s+(+c.pago||0),0);
  const tCpend=(md.contas||[]).filter(c=>!c.ok&&c.plan!=null).reduce((s,c)=>s+(+c.plan||0),0);
  const tCplan=(md.contas||[]).filter(c=>c.plan!=null).reduce((s,c)=>s+(+c.plan||0),0);
  const tR=(md.reservas||[]).reduce((s,r)=>s+(+r.v||0),0);
  const tS=tG+tC+tR;
  const tSall=tG+tC+tCpend+tR;
  const tDeb=(md.gastos||[]).filter(g=>g.forma==='Débito').reduce((s,g)=>s+(+g.v||0),0);
  const tCred=(md.gastos||[]).filter(g=>g.forma==='Crédito').reduce((s,g)=>s+(+g.v||0),0);
  const allMs=Object.values(S.data);
  const acRE=allMs.flatMap(m=>m.reservas||[]).filter(r=>r.tipo==='Reserva de emergência').reduce((s,r)=>s+(+r.v||0),0);
  const acMeta=allMs.flatMap(m=>m.reservas||[]).filter(r=>r.tipo==='Meta').reduce((s,r)=>s+(+r.v||0),0);
  const ePend=(md.entradas||[]).filter(e=>e.v==null).length;
  const cPend=(md.contas||[]).filter(c=>!c.ok).length;
  const rest=tE-tS;
  const restApos=tE-tSall;
  return{tE,tG,tC,tCpend,tCplan,tR,tS,tSall,tDeb,tCred,rest,restApos,acRE,acMeta,md,ePend,cPend};
}

// ─── SVG DONUT ───────────────────────────────────────────────────
function donutSVG(gasto,total){
  const R=68,CX=86,CY=86,circ=2*Math.PI*R;
  const pct=total>0?Math.min(gasto/total,1):0;
  const rest=total-gasto;
  const col=rest<0?'#993C1D':'#1B5E5E';
  const fv=v=>{const a=Math.abs(v);return(v<0?'-':'')+'R$ '+a.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
  return`<svg viewBox="0 0 172 172" style="width:172px;height:172px;display:block;margin:0 auto">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#E0E0E0" stroke-width="20"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${col}" stroke-width="20"
      stroke-dasharray="${pct*circ} ${(1-pct)*circ}" stroke-dashoffset="${circ/4}" stroke-linecap="butt"
      style="transition:stroke-dasharray .6s ease"/>
    <text x="${CX}" y="${CY-18}" text-anchor="middle" fill="#9ab" font-size="8.5" font-family="inherit">restante para gastar</text>
    <text x="${CX}" y="${CY+5}" text-anchor="middle" fill="${col}" font-size="13" font-weight="700" font-family="inherit">${fv(rest)}</text>
    <text x="${CX}" y="${CY+22}" text-anchor="middle" fill="#bbb" font-size="8" font-family="inherit">${Math.round(pct*100)}% comprometido</text>
  </svg>`;
}

function pb(label,atual,meta,color='#1B5E5E'){
  const p=meta>0?Math.min(atual/meta*100,100):0;
  return`<div class="pw"><div class="pm"><span>${label}</span><span>${fmt(atual)} / ${fmt(meta)}</span></div>
    <div class="pt"><div class="pf" style="width:${p}%;background:${color}"></div></div>
    <div class="pp">${p.toFixed(1)}% atingido</div></div>`;
}
function sc(label,val,col,sub=''){
  return`<div class="sc"><div class="sl">${label}</div><div class="sv" style="color:${col||'var(--txt)'}">${val}</div>${sub?`<div style="font-size:0.625rem;color:var(--txt2);margin-top:1px">${sub}</div>`:''}</div>`;
}
function catChart(md){
  const cats=CATS.map(c=>({n:c,v:(md.gastos||[]).filter(g=>g.cat===c).reduce((s,g)=>s+(+g.v||0),0)}))
    .filter(d=>d.v>0).sort((a,b)=>b.v-a.v).slice(0,8);
  if(!cats.length) return`<div class="empty">Adicione gastos para ver o gráfico</div>`;
  const max=cats[0].v;
  const cls=['#1B5E5E','#2D7575','#3D9494','#5DCAA5'];
  return cats.map((c,i)=>`<div class="cbw">
    <div class="cbl"><span>${c.n}</span><span>${fmt(c.v)}</span></div>
    <div class="cbt"><div class="cbf" style="width:${max>0?(c.v/max*100):0}%;background:${cls[Math.min(i,3)]}"></div></div>
  </div>`).join('');
}

// ─── VENCIMENTO ───────────────────────────────────────────────────
function vencStatus(venc){
  if(!venc) return null;
  const now=new Date(),today2=now.getDate(),month=now.getMonth(),year=now.getFullYear();
  const dia=Math.min(venc,new Date(year,month+1,0).getDate());
  const diff=dia-today2;
  if(diff<0)  return{label:'Atrasada '+Math.abs(diff)+(Math.abs(diff)===1?' dia':' dias'),cls:'venc-atrasado',diff};
  if(diff===0)return{label:'Vence hoje!',cls:'venc-hoje',diff};
  if(diff<=3) return{label:'Vence em '+diff+(diff===1?' dia':' dias'),cls:'venc-prox',diff};
  return{label:'Dia '+dia,cls:'venc-ok',diff};
}
function vencLabel(venc){
  if(!venc) return '';
  const st=vencStatus(venc);
  return st?`<span class="bdg ${st.cls}">${st.label}</span>`:'';
}
function getContasAlerta(){
  const currMon=new Date().toISOString().slice(0,7);
  if(S.mon!==currMon) return [];
  return(getMD().contas||[]).filter(c=>!c.ok&&c.venc!=null)
    .map(c=>({...c,status:vencStatus(c.venc)}))
    .filter(c=>c.status&&c.status.diff<=3)
    .sort((a,b)=>a.status.diff-b.status.diff);
}
function alertaBanner(){
  const al=getContasAlerta();
  if(!al.length) return '';
  const rows=al.map(c=>`<div class="alert-row"><span class="an">${c.nome}</span><span class="ad ${c.status.cls}">${c.status.label}</span></div>`).join('');
  return`<div class="alert-banner"><div class="ab-title">&#9888;&#65039; Contas com vencimento próximo</div>${rows}</div>`;
}

  if(ePend>0) alerts+=`<div class="section-note">⏳ ${ePend} entrada(s) aguardando valor — vá em <b>Entradas</b> para preencher</div>`;
  if(cPend>0) alerts+=`<div class="section-note">⏳ ${cPend} conta(s) a pagar — vá em <b>Contas</b> para marcar como paga</div>`;

// ─── EDIT HANDLERS ───────────────────────────────────────────────
function _te(rowId,inpId,cur){
  const row=document.getElementById(rowId);if(!row)return;
  if(row.style.display!=='none'){row.style.display='none';return;}
  row.style.display='flex';
  const inp=document.getElementById(inpId);
  if(inp){inp.value=cur>0?cur:'';setTimeout(()=>inp.focus(),80);}
}
function _ce(inpId,saveFn){
  const inp=document.getElementById(inpId);if(!inp)return;
  const v=parseFloat(inp.value);
  if(!v||v<=0){inp.style.border='1.5px solid #993C1D';setTimeout(()=>{if(inp)inp.style.border='';},1500);inp.focus();return;}
  saveFn(v);
}
function teE(id,cur){_te('fre'+id,'fve'+id,cur);}
function ceE(id){_ce('fve'+id,v=>{setMD('entradas',a=>a.map(i=>i.id===id?{...i,v}:i));render();});}
function teG(id,cur){_te('frg'+id,'fvg'+id,cur);}
function ceG(id){_ce('fvg'+id,v=>{setMD('gastos',a=>a.map(g=>g.id===id?{...g,v}:g));render();});}
function teC(id,cur){_te('frc'+id,'fvc'+id,cur);}
function ceC(id){_ce('fvc'+id,v=>{
  const vi=document.getElementById('fvd'+id);
  const venc=vi&&vi.value?parseInt(vi.value):undefined;
  setMD('contas',a=>a.map(c=>{
    if(c.id!==id)return c;
    const updated={...c,pago:v,ok:true,dt:today(),...(venc!==undefined?{venc}:{})};
    if(c.tid&&venc!==undefined){const tpl=T_.contas.find(t=>t.id===c.tid);if(tpl)tpl.venc=venc;}
    return updated;
  }));
  render();
});}
function teR(id,cur){_te('frr'+id,'fvr'+id,cur);}
function ceR(id){_ce('fvr'+id,v=>{setMD('reservas',a=>a.map(r=>r.id===id?{...r,v}:r));render();});}

// ─── CONTA TOGGLE ─────────────────────────────────────────────────
function togConta(id){
  setMD('contas',a=>a.map(c=>{
    if(c.id!==id)return c;
    const nowOk=!c.ok;
    return{...c,ok:nowOk,dt:nowOk?today():c.dt,pago:nowOk?(c.pago!=null?c.pago:c.plan!=null?c.plan:null):c.pago};
  }));
  render();
}

// ─── DELETE ───────────────────────────────────────────────────────
function delItem(sec,id){
  if(!confirm('Remover este item?'))return;
  const md=getMD();
  const item=(md[sec]||[]).find(i=>i.id===id);
  if(item&&item.tid){
    const rmTpl=confirm('Este item se repete todo mês. Remover dos próximos meses também?');
    if(rmTpl){
      T_[sec]=(T_[sec]||[]).filter(t=>t.id!==item.tid);
      Object.keys(S.data).forEach(mon=>{if(S.data[mon][sec])S.data[mon][sec]=S.data[mon][sec].filter(i=>i.tid!==item.tid);});
      scheduleSave();render();return;
    }
  }
  setMD(sec,a=>a.filter(i=>i.id!==id));
  render();
}

    b.innerHTML=`<div style="text-align:center;margin-bottom:4px">
        <div class="avatar-cfg" id="cfg-avatar" onclick="pickFoto()"></div>
        <div class="avatar-cfg-lbl">Toque para escolher uma foto${S.cfg.foto?'<br><span style="color:#993C1D;cursor:pointer" onclick="event.stopPropagation();removeFoto()">Remover foto</span>':''}</div>
      </div>
      <div class="fld"><label>Seu nome</label><input id="f-nome" value="${S.cfg.nome}" placeholder="Ex: João Silva" oninput="previewName(this.value)"/></div>
      <div class="fld"><label>Meta — Reserva de Emergência (R$)</label><input id="f-remet" type="number" value="${S.cfg.reMeta}"/></div>
      <div class="fld"><label>Nome da meta pessoal</label><input id="f-metnom" value="${S.cfg.metaNome}"/></div>
      <div class="fld"><label>Valor da meta pessoal (R$)</label><input id="f-metval" type="number" value="${S.cfg.metaVal}"/></div>
      <div class="sep"></div>
      <div class="fld"><label>Tamanho da fonte</label>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <button onclick="chFs(-5)" style="width:40px;height:40px;border-radius:8px;border:1px solid var(--bdr);background:var(--bg);color:var(--txt);font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600">−</button>
          <div style="flex:1;text-align:center"><div id="fs-val" style="font-size:1.375rem;font-weight:700;color:var(--t)">${S.cfg.fs||100}%</div><div style="font-size:0.625rem;color:var(--txt2);margin-top:2px">Padrão: 100%</div></div>
          <button onclick="chFs(5)" style="width:40px;height:40px;border-radius:8px;border:1px solid var(--bdr);background:var(--bg);color:var(--txt);font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600">+</button>
        </div>
        <div style="display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap">
          ${[75,85,100,115,130,150].map(v=>`<button onclick="S.cfg.fs=${v};applyFs(${v});scheduleSave();document.getElementById('fs-val').textContent='${v}%'" style="padding:5px 10px;border-radius:6px;border:1px solid var(--bdr);background:${(S.cfg.fs||100)===v?'var(--t)':'var(--bg)'};color:${(S.cfg.fs||100)===v?'#fff':'var(--txt)'};font-size:0.75rem;cursor:pointer">${v}%</button>`).join('')}
        </div>
      </div>
      <button class="btn btnf" onclick="saveCfg()">Salvar configurações</button>`;
    const cfgAv=document.getElementById('cfg-avatar');
    if(cfgAv)renderCfgAvatar(cfgAv);
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function ovClick(e){if(e.target===document.getElementById('modal'))closeModal();}
function toggleChk(id){
  const el=document.getElementById(id);if(!el)return;
  el.classList.toggle('on');
  el.innerHTML=el.classList.contains('on')?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':'';
}
function chkVal(id){return document.getElementById(id)?.classList.contains('on');}

// ─── SAVE HANDLERS ───────────────────────────────────────────────
function saveEntrada(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome)return alert('Informe uma descrição.');
  const valEl=document.getElementById('f-val').value;
  const v=valEl?parseFloat(valEl):null;
  const rec=chkVal('chk-rec');
  const tid=rec?uid():null;
  if(rec){T_.entradas.push({id:tid,nome});}
  setMD('entradas',a=>[...a,{id:uid(),tid,nome,v,recorrente:rec}]);
  closeModal();render();
}
function saveGasto(){
  const cat=document.getElementById('f-cat').value;
  const v=parseFloat(document.getElementById('f-val').value);
  if(!cat||!v)return alert('Selecione a categoria e informe o valor.');
  const forma=document.getElementById('f-forma').value;
  const dt=document.getElementById('f-dt').value;
  const ess=chkVal('chk-ess');
  setMD('gastos',a=>[...a,{id:uid(),cat,forma,v,dt,ess}]);
  closeModal();render();
}
function saveConta(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome)return alert('Informe o nome da conta.');
  const planEl=document.getElementById('f-plan').value;
  const plan=planEl?parseFloat(planEl):null;
  const vencEl=document.getElementById('f-venc').value;
  const venc=vencEl?parseInt(vencEl):null;
  const rec=chkVal('chk-rec');
  const tid=rec?uid():null;
  if(rec){T_.contas.push({id:tid,nome,plan,venc});}
  setMD('contas',a=>[...a,{id:uid(),tid,nome,plan,venc,pago:null,dt:'',ok:false,recorrente:rec}]);
  closeModal();render();
}
function saveReserva(){
  const nome=document.getElementById('f-nome').value.trim();
  const v=parseFloat(document.getElementById('f-val').value);
  if(!nome||!v)return alert('Preencha todos os campos.');
  const tipo=document.getElementById('f-tipo').value;
  const dt=document.getElementById('f-dt').value;
  setMD('reservas',a=>[...a,{id:uid(),nome,tipo,v,dt}]);
  closeModal();render();
}
function saveCfg(){
  S.cfg.nome=document.getElementById('f-nome').value.trim()||S.cfg.nome;
  S.cfg.reMeta=parseFloat(document.getElementById('f-remet').value)||S.cfg.reMeta;
  S.cfg.metaNome=document.getElementById('f-metnom').value.trim()||S.cfg.metaNome;
  S.cfg.metaVal=parseFloat(document.getElementById('f-metval').value)||S.cfg.metaVal;
  scheduleSave();updateHeaderProfile();closeModal();render();
}

// ─── PROFILE & FOTO ───────────────────────────────────────────────
function updateHeaderProfile(){
  const nameEl=document.getElementById('hdr-name');
  const avEl=document.getElementById('hdr-avatar');
  const emailEl=document.getElementById('hdr-email');
  if(nameEl)nameEl.textContent=S.cfg.nome?'Olá, '+S.cfg.nome+'!':'Financ';
  if(emailEl&&S.user)emailEl.textContent=S.user.email;
  if(avEl){
    if(S.cfg.foto){avEl.innerHTML=`<img src="${S.cfg.foto}" alt="foto"/>`;}
    else if(S.cfg.nome){const i=S.cfg.nome.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();avEl.innerHTML=`<span style="font-size:1rem;font-weight:700;color:#fff">${i}</span>`;}
    else{avEl.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="26" height="26"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;}
  }
}
function handleFoto(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    S.cfg.foto=e.target.result;
    scheduleSave();updateHeaderProfile();
    const prev=document.getElementById('cfg-avatar');
    if(prev)renderCfgAvatar(prev);
  };
  reader.readAsDataURL(file);
  event.target.value='';
}
function pickFoto(){document.getElementById('foto-input').click();}
function removeFoto(){S.cfg.foto='';scheduleSave();updateHeaderProfile();const a=document.getElementById('cfg-avatar');if(a)renderCfgAvatar(a);}
function renderCfgAvatar(el){
  if(S.cfg.foto){el.innerHTML=`<img src="${S.cfg.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/><div class="overlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Alterar</div>`;}
  else if(S.cfg.nome){const i=S.cfg.nome.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();el.innerHTML=`<span style="font-size:1.75rem;font-weight:700;color:var(--t)">${i}</span><div class="overlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Adicionar foto</div>`;}
  else{el.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36" style="color:var(--txt2)"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div class="overlay">Adicionar foto</div>`;}
}
function previewName(val){const el=document.getElementById('hdr-name');if(el)el.textContent=val?'Olá, '+val+'!':'Financ';}

// ─── FONT SIZE ────────────────────────────────────────────────────
function applyFs(v){document.documentElement.style.fontSize=(16*v/100)+'px';}
function chFs(delta){
  const nv=Math.min(Math.max((S.cfg.fs||100)+delta,75),150);
  S.cfg.fs=nv;applyFs(nv);scheduleSave();
  const el=document.getElementById('fs-val');if(el)el.textContent=nv+'%';
}

// ─── NOTIFICAÇÕES ─────────────────────────────────────────────────
function checkVencNotifications(){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  getContasAlerta().forEach(c=>{
    const key='notif_'+c.id+'_'+new Date().toDateString();
    if(localStorage.getItem(key))return;
    const msg=c.status.diff<0?`"${c.nome}" está atrasada ${Math.abs(c.status.diff)} dia(s)!`:c.status.diff===0?`"${c.nome}" vence HOJE!`:`"${c.nome}" vence em ${c.status.diff} dia(s).`;
    new Notification('💰 Financ',{body:msg});
    localStorage.setItem(key,'1');
  });
}

// ─── INIT ─────────────────────────────────────────────────────────
if(supa) supa.auth.onAuthStateChange(async(event,session)=>{
  // Recuperação de senha — mostrar formulário de nova senha
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
    hideAllForms();
    document.getElementById('auth-form-newpass').style.display='';
    document.getElementById('auth-title').textContent='Criar nova senha';
    document.getElementById('auth-switch-lbl').innerHTML='';
    return;
  }
  if(session&&event!=='PASSWORD_RECOVERY'){
    removeSplash();
    S.user=session.user;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    await loadFromCloud();
    ensureTemplates();
    document.getElementById('mlbl').textContent=mLabel(S.mon);
    render();
    if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().then(p=>{if(p==='granted')setTimeout(checkVencNotifications,2000);});
    else if('Notification'in window&&Notification.permission==='granted')setTimeout(checkVencNotifications,2000);
  }else if(!session){
    removeSplash();
    S.user=null;
    document.getElementById('app').style.display='none';
    document.getElementById('auth-screen').style.display='flex';
    showLogin();
  }
});

// Se Supabase nao carregou, mostrar login direto
if(!supa){try{removeSplash();showLogin();showAuthErr('⚠️ Erro de conexão. Verifique sua internet e recarregue a página.');}catch(e){}}

// Splash some SEMPRE após 1.5s — independente do Supabase
function removeSplash(){
  try{
    const s=document.getElementById('splash');
    if(s){s.style.animation='none';s.style.opacity='0';s.style.visibility='hidden';s.style.pointerEvents='none';setTimeout(()=>{try{if(s&&s.parentNode)s.remove();}catch(e){}},500);}
  }catch(e){}
}
setTimeout(removeSplash, 1500);

// Timeout de segurança: se em 4s o Supabase não respondeu, mostra tela de login
setTimeout(()=>{
  const splash=document.getElementById('splash');
  if(splash) removeSplash();
  if(!S.user){
    const authScreen=document.getElementById('auth-screen');
    const app=document.getElementById('app');
    if(authScreen) authScreen.style.display='flex';
    if(app) app.style.display='none';
    showLogin();
  }
}, 4000);
</script>
</body>
</html>
